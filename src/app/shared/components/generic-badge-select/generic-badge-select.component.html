@if (label()) {
  <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">{{ label() }}</label>
}
<div class="flex flex-wrap gap-2">
  @for (option of options(); track option.value) {
    <button
      type="button"
      (click)="select(option.value)"
      [class]="value() === option.value ? option.selectedClass : option.unselectedClass"
      class="px-3 py-1.5 rounded-full text-sm font-medium transition-all cursor-pointer border"
    >
      {{ option.label }}
    </button>
  }
</div>
